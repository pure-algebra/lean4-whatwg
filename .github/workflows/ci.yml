name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
      # The production libraries and gate executables; the test root with its
      # elaboration-time axiom gate is built by the default targets below.
      # `Whatwg` is the umbrella module; each standard is its own library
      # (ruling R-V3(d)), and each is built here as a target of its own.
      - name: Build production libraries and gate executables
        run: lake --wfail build Whatwg WhatwgInfra WhatwgEcma262 WhatwgWebIdl WhatwgUrl WhatwgHtml WhatwgStreams WhatwgSignatures WhatwgGates whatwg_vendorseal whatwg_citations whatwg_census whatwg_urlinventory whatwg_urlcensus whatwg_ledger whatwg_declsnapshot whatwg_trustgate
      - name: Vendor seal in both directions
        run: lake exe whatwg_vendorseal
      - name: Internal-citation gate
        run: lake exe whatwg_citations
      - name: URL source inventory projection drift
        run: lake exe whatwg_urlinventory
      - name: URL authored census and assignment projection drift
        run: lake exe whatwg_urlcensus
      # Every census step links a coverage numerator: since the first P3
      # witnesses landed, whatwgbin/Census.lean imports
      # WhatwgTest/Audit/SpecCoverage.lean so that the block below is
      # printed from that module's checked emit instead of from assumed zeros,
      # and since slice Q2 it also imports the Web IDL and ECMA-262 numerators
      # and hands Gates.Census.cli a map from standard key to emit.
      # Building the census executable therefore elaborates all three
      # numerators' gates, and a red numerator fails here rather than printing
      # a number.
      - name: Specification-algorithm census, and the coverage emit against it
        run: lake exe whatwg_census
      - name: Specification coverage block from the Lean emit
        run: lake exe whatwg_census --report
      - name: Infra definition census and generated row drift
        run: lake exe whatwg_census --standard infra
      # The Web IDL promise and exception census (slices Q1 and Q2 of
      # docs/PROMISE-PACKAGE-PLAN.md), and its coverage block. Q2 gave the
      # standard a numerator, so unlike --standard infra it now reports; the
      # block is all-absent and says that nothing is proved.
      - name: Web IDL promise and exception census and generated row drift
        run: lake exe whatwg_census --standard webidl
      - name: Web IDL coverage block from the Lean emit
        run: lake exe whatwg_census --standard webidl --report
      # The ECMA-262 promise and job census, read through the ecmarkup profile
      # of WhatwgGates/Ecmarkup.lean, and its coverage block, all-absent for the
      # same reason. Infra remains the one standard with no numerator and no
      # report.
      - name: ECMA-262 census
        run: lake exe whatwg_census --standard ecma262
      - name: ECMA-262 coverage block from the Lean emit
        run: lake exe whatwg_census --standard ecma262 --report
      - name: Test root and the elaboration-time axiom gate
        run: lake --wfail build WhatwgTest
      # Ruling R-W7, addendum V2e. The executable gate runs the in-tree gate's
      # passes from outside the tree it audits: it reads the built modules
      # with no extension loaded and runs none of their code, so an elaborator
      # that replaces the in-tree command cannot silence it. It refuses a
      # stale or missing .olean, a recorded option that differs from
      # lakefile.toml, and an audited module that writes to an environment
      # extension outside the allowlist. It prints the summary line of the
      # in-tree gate; the self-test below checks that the two agree.
      - name: Executable trust gate over the built modules
        run: lake exe whatwg_trustgate
      # Rulings R-W5 and R-W6 of review lane W. Both gates read the built
      # modules, so they follow the test root. The ledger gate resolves every
      # reference of the graph ledger under WhatwgTest/Ledger against the built
      # environment, the rulings of COORDINATION.md and the counterexample
      # register, and compares generated/graphs with a fresh rendering. The
      # snapshot gate compares generated/declarations with a fresh snapshot of
      # the production libraries and joins records, freeze entries and census
      # rows.
      - name: Graph ledger and its projection drift
        run: lake exe whatwg_ledger
      - name: Declaration snapshot and its projection drift
        run: lake exe whatwg_declsnapshot
      # Ruling R-V2 returns the trust-gate self-test to CI after its removal on
      # 2026-09-03. It copies the sources and the build cache into a throwaway
      # directory, so it must follow the full build above: each planted
      # violation is then one incremental build of the roots it touches. It
      # checks the declared red set, plants the older trust-gate violations
      # and every row of test/contracts/trust-gate-hardening.contract.md, and
      # runs the gate and the coverage numerator by relative file name.
      - name: Trust-gate self-test (planted violations, controls and narrow runs)
        run: lake exe whatwg_trustselftest
      # Ruling R-V2: a kernel replay of every module of the three libraries.
      # leanchecker re-adds each module's declarations to the environment its
      # imports build and type-checks them in the kernel, so a declaration the
      # kernel never checked (debug.skipKernelTC set by a metaprogram, which no
      # axiom records and no token names) fails here. Measured by the V2 gate
      # builder on 2026-10-01 on the Windows development host: 216 modules in
      # 79 s, exit 0, inside the fifteen-minute bound of R-V2.
      - name: Kernel replay of Whatwg, WhatwgTest and WhatwgGates (leanchecker)
        run: lake env leanchecker Whatwg WhatwgTest WhatwgGates
