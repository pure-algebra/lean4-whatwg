name = "whatwg"
version = "0.1.0"
description = "WHATWG standards reified in Lean 4, one library per standard; Streams first: spec-authoritative first-order model, relational semantics, EffHOL logic layer, checked TypeScript lowering"
keywords = ["whatwg", "streams", "infra", "verified", "lean4"]
license = "MIT"
readmeFile = "README.md"
defaultTargets = ["Whatwg", "WhatwgInfra", "WhatwgEcma262", "WhatwgWebIdl",
                  "WhatwgUrl", "WhatwgHtml", "WhatwgSvg", "WhatwgCss", "WhatwgAuto", "WhatwgStreams", "WhatwgSignatures",
                  "WhatwgGates", "WhatwgTest",
                  "whatwg_vendorseal", "whatwg_citations", "whatwg_census",
                  "whatwg_urlinventory", "whatwg_urlcensus", "whatwg_htmlstandard",
                  "whatwg_svgdefinitions", "whatwg_svggrammar", "whatwg_xmlproductions", "whatwg_cssblocks",
                  "whatwg_ledger", "whatwg_declsnapshot", "whatwg_trustgate"]

# Ruling R-6 (docs/SHA256-DAG.md §9), package-wide: no implicit binder is
# invented from a free variable, and every warning is an error at elaboration
# so that `lake --wfail build` and a plain `lake build` decide the same thing.
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false, warningAsError = true }

# The production libraries: one per standard, and the umbrella. Semantic
# declarations and proofs only (ruling R-V3(d)). Each standard's library owns
# its root module and every module under it, so `lake build WhatwgEcma262`
# builds that standard's import closure and nothing else. `Whatwg` owns only
# the umbrella module `Whatwg`, whose imports reach every standard's root, so
# `lake build Whatwg` still builds the whole production tree. No module is
# owned by two libraries: Lake counts every submodule of a library's root as
# local to that library, so the umbrella declares no root and names its one
# module by an exact glob (with `roots = ["Whatwg"]` it would claim every
# `Whatwg.*` module beside the library that owns it).
[[lean_lib]]
name = "Whatwg"
roots = []
globs = ["Whatwg"]

[[lean_lib]]
name = "WhatwgInfra"
roots = ["Whatwg.Infra"]
globs = ["Whatwg.Infra.*"]

[[lean_lib]]
name = "WhatwgEcma262"
roots = ["Whatwg.Ecma262"]
globs = ["Whatwg.Ecma262.*"]

[[lean_lib]]
name = "WhatwgWebIdl"
roots = ["Whatwg.WebIdl"]
globs = ["Whatwg.WebIdl.*"]

[[lean_lib]]
name = "WhatwgUrl"
roots = ["Whatwg.Url"]
globs = ["Whatwg.Url.*"]

[[lean_lib]]
name = "WhatwgHtml"
roots = ["Whatwg.Html"]
globs = ["Whatwg.Html.*"]

# SVG 2, a W3C standard: the elements and attributes that an HTML tree holds
# inline (docs/SVG-PACKAGE-PLAN.md). It imports no module of `Whatwg.Html`;
# the seam in `Whatwg.Html` imports it.
[[lean_lib]]
name = "WhatwgSvg"
roots = ["Whatwg.Svg"]
globs = ["Whatwg.Svg.*"]

# CSS adopted as data (docs/CSS-PACKAGE-PLAN.md): W3C modules, sealed as Bikeshed sources.
[[lean_lib]]
name = "WhatwgCss"
roots = ["Whatwg.Css"]
globs = ["Whatwg.Css.*"]

# Proof search for the law graphs: the named Aesop rule banks. The one library
# that imports Aesop directly; a proof module imports its banks (ruling
# R-S10).
[[lean_lib]]
name = "WhatwgAuto"
roots = ["Whatwg.Auto"]
globs = ["Whatwg.Auto.*"]

[[lean_lib]]
name = "WhatwgStreams"
roots = ["Whatwg.Streams"]
globs = ["Whatwg.Streams.*"]

# The `Effects.Signature` faces (ruling R-W3), not a standard: the one
# production library that imports the `effects` package, so that no standard's
# library needs it to build. It owns `Whatwg.Signatures` and every module under
# it. The tree is not `Whatwg.Effects`, which would shadow the root namespace
# `Effects` inside its own modules.
[[lean_lib]]
name = "WhatwgSignatures"
roots = ["Whatwg.Signatures"]
globs = ["Whatwg.Signatures.*"]

# Repository gates implemented in Lean. Tooling, not semantics; audited for
# totality and forbidden axioms under ruling R-11's ceiling, like every tree.
# The modules are `WhatwgGates.*` and their declarations keep the namespace
# `Gates.*` (ruling R-V3(c)).
[[lean_lib]]
name = "WhatwgGates"
globs = ["WhatwgGates.*"]

# Contracts, attacks, receipts, and the elaboration-time axiom gate.
[[lean_lib]]
name = "WhatwgTest"
globs = ["WhatwgTest.*"]


# Executable entry points. Each is a one-line wrapper under `whatwgbin/` that
# calls the audited `cli` of its WhatwgGates module; `whatwgbin/` itself holds
# no logic, and the census entry point alone also imports the test-side
# coverage numerators.
#
# Lake resolves module names and executable names across the whole workspace,
# so a package that requires this one could not also define `Gates.Common`, a
# `bin.*` or bare `Citations` root, or an executable called `census`
# (docs/AGENT-ROUTING.md, "Packages cloned from this skeleton"). Every entry
# point therefore uses `root = "whatwgbin.<Name>"` under the default source
# directory, which resolves to `whatwgbin/<Name>.lean`, and every executable
# name carries the `whatwg_` prefix.

[[lean_exe]]
name = "whatwg_vendorseal"
root = "whatwgbin.VendorSeal"

[[lean_exe]]
name = "whatwg_citations"
root = "whatwgbin.Citations"

[[lean_exe]]
name = "whatwg_urlinventory"
root = "whatwgbin.UrlInventory"

[[lean_exe]]
name = "whatwg_urlcensus"
root = "whatwgbin.UrlCensus"

[[lean_exe]]
name = "whatwg_trustselftest"
root = "whatwgbin.TrustSelfTest"

# The HTML Standard's element definitions as a projection (slice H6):
# `generated/html-standard-elements.tsv` and `Whatwg/Html/Schema/Standard.lean`
# regenerated from the sealed `vendor/whatwg-html-746f2ede/source` and
# checked for byte drift. Port fidelity is stated against these rows.
[[lean_exe]]
name = "whatwg_htmlstandard"
root = "whatwgbin.HtmlStandard"

# The SVG 2 definitions as a projection (slice S2 of docs/SVG-PACKAGE-PLAN.md):
# `generated/svg-*.tsv` and the four generated modules of `Whatwg/Svg/Schema/`,
# regenerated from the sealed `vendor/w3c-svgwg-47e645ef/` and checked for
# byte drift.
[[lean_exe]]
name = "whatwg_svgdefinitions"
root = "whatwgbin.SvgDefinitions"

# The gate of debt D95 (ruling SV-37 of docs/SVG-PACKAGE-PLAN.md): the grammar of path data in
# the sealed chapter `master/paths.html` and its description in `Whatwg/Svg/Value/Path.lean`
# have one language, production by production.
[[lean_exe]]
name = "whatwg_svggrammar"
root = "whatwgbin.SvgGrammar"

# The gate of debt D105 (ruling SV-42 of docs/SVG-PACKAGE-PLAN.md): the productions `Char`,
# `NameStartChar`, `NameChar` and `Name` of the sealed XML 1.0 and their functions in
# `Whatwg/Html/Print/Xml/Productions.lean` agree, the first three at every code point.
[[lean_exe]]
name = "whatwg_xmlproductions"
root = "whatwgbin.XmlProductions"

# The data blocks of the sealed CSS modules as tables (slice K1 of docs/CSS-PACKAGE-PLAN.md):
# `generated/css/` and `Whatwg/Css/Data/Pairs.lean`, regenerated from the sealed sources under
# `vendor/w3c-csswg-drafts-50337328/` and checked for byte drift, with the extractor's controls.
[[lean_exe]]
name = "whatwg_cssblocks"
root = "whatwgbin.CssBlocks"

# The P1 specification-algorithm census, and since slice Q2 the Web IDL and
# ECMA-262 censuses, each with its coverage report.
[[lean_exe]]
name = "whatwg_census"
root = "whatwgbin.Census"

# The W7 graph ledger (test/contracts/graph-ledger.contract.md, ruling R-W6).
# No `needs`: it reads the built environment through the shared loader, which
# refuses a missing or stale `.olean`, so it runs after `lake build`. Its link
# closure is the ledger data, the tooling modules and the loader, never a
# production module.
[[lean_exe]]
name = "whatwg_ledger"
root = "whatwgbin.Ledger"

# The declaration snapshot of ruling R-W5 (test/contracts/declaration-snapshot.contract.md):
# reads the built .olean files through the shared loader WhatwgGates/Trust/Load.lean
# and writes or checks generated/declarations/<library>.tsv.
[[lean_exe]]
name = "whatwg_declsnapshot"
root = "whatwgbin.DeclSnapshot"

# The executable trust gate of addendum V2e (ruling R-W7(a)): the passes of
# WhatwgGates/Trust/ over the built .olean files, imported with no extension
# loaded, so that no audited initializer, parser or elaborator runs in its
# process. No `needs` and no `supportInterpreter`: it refuses a missing or stale
# .olean, so it runs after `lake build`, and it evaluates nothing it imports.
# Its link closure is the gate library, the loader and the config module.
[[lean_exe]]
name = "whatwg_trustgate"
root = "whatwgbin.TrustGate"

# The proved hash functions the gates compute every digest with. Exact commit
# of pure-algebra/lean4-hash `main`, the pin lean4-effect4 uses (ruling
# R-V3(b)); MIT from this commit. The vendor manifest regenerated
# byte-identically through `Hash.Sha256.sha256` at the swap (step 6 of
# docs/HASH-PACKAGE-PLAN.md) and again at this pin, which is the cutover proof.
[[require]]
name = "hash"
git = "https://github.com/pure-algebra/lean4-hash"
rev = "c906b15dc3e94ebac0c10056270fbb345a1d2b6e"

# The generic effect algebra every standard here builds against (RS-D1 as
# ruled in lean4-effect4 docs/EFFECTS-SPLIT-PLAN.md, EP-9), with signature
# morphisms, handler transport, families, and the generic first-order Flow.
# Exact commit of tag v0.8.0 of pure-algebra/lean4-effects, the pin
# lean4-effect4 uses (ruling R-V3(b)). Only the library `WhatwgSignatures`
# imports it (ruling R-W3).
[[require]]
name = "effects"
git = "https://github.com/pure-algebra/lean4-effects"
rev = "a4ee7a14248ee5976039b73039319efa87834986"

# TypeScript as a target: syntax, renderer, identifier profile, host pins.
# Exact commit of pure-algebra/lean4-typescript whose lakefile declares
# version 0.6.0, the pin lean4-effect4 uses (ruling R-V3(b)); the remote
# carries no `v0.6.0` tag, and the commit is the tip of its branch
# `codex/typed-source-carrier`. P11 lowers through it instead of declaring a
# second intermediate representation. Nothing imports it yet.
[[require]]
name = "typescript"
git = "https://github.com/pure-algebra/lean4-typescript"
rev = "6afc9b841603796c16b266c0b8b92ded37a9445c"

# Proof search for the law graphs: the named rule banks of
# `Whatwg/Auto/RuleSets.lean` and the census instruments beside them (owner
# direction of 2026-10-11, ruling R-S10 of COORDINATION.md). The commit is the
# one lean4-effect4 pins, the release for this toolchain; it brings
# `batteries`. A proof that the search finds is a term the kernel checks, and
# the axiom gate holds it to its tree's ceiling like any other.
[[require]]
name = "aesop"
git = "https://github.com/leanprover-community/aesop"
rev = "3448c0bcc5ce01b2d1546e483ec3620e32df3d0e"
